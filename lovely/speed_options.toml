[manifest]
version = "1.0.0"
dump_lua = true
priority = 99999999

[[patches]]
[patches.pattern]
target = "globals.lua"
pattern = "GAMESPEED = 1,"
position = "after"
payload = '''FASTFORWARD = 0,
STATUSTEXT = 0,'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "func = (function() check_for_unlock{type = 'upgrade_hand', hand = hand, level = G.GAME.hands[hand].level} return true end)"
position = "before"
payload = '''blockable = false,
blocking = false,'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "for k, v in pairs(settings_file) do"
position = "after"
payload = "if k == 'FASTFORWARD' then v = math.min(2, v) end"
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "if location == 'front' or self.config.type == 'deck' then"
position = "before"
payload = "self.cards = self.cards or {}"
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "if (self == G.hand or self == G.deck or self == G.discard or self == G.play) and G.view_deck and G.view_deck[1] and G.view_deck[1].cards then return end"
position = "after"
payload = "self.children = self.children or {}"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "create_option_cycle({label = localize('b_set_gamespeed'),scale = 0.8, options = {0.5, 1, 2, 4}, opt_callback = 'change_gamespeed', current_option = (G.SETTINGS.GAMESPEED == 0.5 and 1 or G.SETTINGS.GAMESPEED == 4 and 4 or G.SETTINGS.GAMESPEED + 1)}),"
position = "at"
payload = '''G.UIDEF.lostedspeed_options(),
G.UIDEF.lostedspeed_fastforward_options(),
G.UIDEF.lostedspeed_statustext_options(),'''
match_indent = true
