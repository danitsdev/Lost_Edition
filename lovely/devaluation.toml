[manifest]
version = "1.0.0"
dump_lua = true
priority = 67

# Devaluation: allow vanilla royal-rank Jokers (Baron, Shoot the Moon, Hit the Road, Triboulet, Mail-In Rebate, The Idol) to match any royal rank
[[patches]]
[patches.regex]
target = 'card.lua'
pattern = 'context\.other_card:get_id\(\) == (?<rank>1[123]\b|G\.GAME\.current_round\.(?:mail|idol)_card\.id)'
position = 'at'
payload = 'context.other_card:losted_is_rank($rank)'
