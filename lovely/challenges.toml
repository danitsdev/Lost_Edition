[manifest]
version = "1.0.0"
dump_lua = true
priority = 9999999

# No tags
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "if type == 'Small' then"
position = "at"
payload = "if type == 'Small' and not G.GAME.modifiers.no_tags then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "elseif type == 'Big' then"
position = "at"
payload = "elseif type == 'Big' and not G.GAME.modifiers.no_tags then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "elseif not run_info then"
position = "at"
payload = "elseif type == 'Boss' and not run_info then"
match_indent = true


# Only boss blinds
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME.round_resets.blind_choices.Boss = get_new_boss()"
position = "at"
payload = '''
if G.GAME.modifiers.boss_rush then
    local small, big, boss = LOSTEDMOD.funcs.get_boss_rush_choices()
    self.GAME.round_resets.blind_choices.Small = small
    self.GAME.round_resets.blind_choices.Big = big
    self.GAME.round_resets.blind_choices.Boss = boss
else
    local boss = get_new_boss()
    self.GAME.round_resets.blind_choices.Boss = boss
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "G.GAME.round_resets.blind_choices.Boss = get_new_boss()"
position = "at"
payload = '''
if G.GAME.modifiers.boss_rush then
    local small, big, boss = LOSTEDMOD.funcs.get_boss_rush_choices()
    G.GAME.round_resets.blind_choices.Small = small
    G.GAME.round_resets.blind_choices.Big = big
    G.GAME.round_resets.blind_choices.Boss = boss
else
    local boss = get_new_boss()
    G.GAME.round_resets.blind_choices.Boss = boss
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "self.chips = get_blind_amount(G.GAME.round_resets.ante)*self.mult*G.GAME.starting_params.ante_scaling"
position = "at"
payload = '''
if G.GAME.modifiers.boss_rush then
    local base_score = get_blind_amount(G.GAME.round_resets.ante) * self.mult * G.GAME.starting_params.ante_scaling
    if G.GAME.blind_on_deck == 'Small' then
        self.chips = math.floor(base_score * 0.5)
    elseif G.GAME.blind_on_deck == 'Big' then
        self.chips = math.floor(base_score * 0.75)
    else
        self.chips = base_score
    end
else
    self.chips = get_blind_amount(G.GAME.round_resets.ante) * self.mult * G.GAME.starting_params.ante_scaling
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling"
position = "after"
payload = '''
if G.GAME.modifiers.boss_rush then
    if type == 'Small' then
        blind_amt = math.floor(blind_amt * 0.5)
    elseif type == 'Big' then
        blind_amt = math.floor(blind_amt * 0.75)
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.blind:get_type() == 'Boss' then"
position = "at"
payload = "if G.GAME.blind_on_deck == 'Boss' then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.round_resets.blind == G.P_BLINDS.bl_small then"
position = "at"
payload = "if G.GAME.blind_on_deck == 'Small' then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "elseif G.GAME.round_resets.blind == G.P_BLINDS.bl_big then"
position = "at"
payload = "elseif G.GAME.blind_on_deck == 'Big' then"
match_indent = true

# Boss blind semantics
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.blind:get_type() == 'Boss' and not G.GAME.seeded and not G.GAME.challenge  then"
position = "at"
payload = "if G.GAME.blind and G.GAME.blind.boss and not G.GAME.seeded and not G.GAME.challenge then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if G.GAME.current_round.hands_played == 1 and\n                        G.GAME.current_round.discards_left == G.GAME.round_resets.discards and\n                        G.GAME.blind:get_type() == 'Boss' then"
position = "at"
payload = "if G.GAME.current_round.hands_played == 1 and\n                        G.GAME.current_round.discards_left == G.GAME.round_resets.discards and\n                        G.GAME.blind and G.GAME.blind.boss then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if G.GAME.last_hand_played == card.unlock_condition.extra and G.GAME.blind:get_type() == 'Boss' then"
position = "at"
payload = "if G.GAME.last_hand_played == card.unlock_condition.extra and G.GAME.blind and G.GAME.blind.boss then"
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "local disableable = G.GAME.blind and ((not G.GAME.blind.disabled) and (G.GAME.blind:get_type() == 'Boss'))"
position = "at"
payload = "local disableable = G.GAME.blind and ((not G.GAME.blind.disabled) and G.GAME.blind.boss)"
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if G.GAME.blind and ((not G.GAME.blind.disabled) and (G.GAME.blind:get_type() == 'Boss')) then"
position = "at"
payload = "if G.GAME.blind and ((not G.GAME.blind.disabled) and G.GAME.blind.boss) then"
match_indent = true

# Only Jokers
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME.joker_rate = 0"
position = "after"
payload = '''
elseif v.id == 'only_jokers' then
    self.GAME.planet_rate = 0
    self.GAME.tarot_rate = 0
    self.GAME.spectral_rate = 0
'''
match_indent = true

# Force selection 
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "function Blind:drawn_to_hand()"
position = "after"
payload = '''
if G.GAME.modifiers.force_selection and not self.disabled and #G.hand.cards > 0 then
    local any_forced = nil
    for _, playing_card in ipairs(G.hand.cards) do
        if playing_card.ability.forced_selection then
            any_forced = true
            break
        end
    end
    if not any_forced then
        G.hand:unhighlight_all()
        local forced_card = pseudorandom_element(G.hand.cards, 'puppeteer_challenge')
        if forced_card then
            forced_card.ability.forced_selection = true
            G.hand:add_to_highlighted(forced_card)
        end
    end
end
'''
match_indent = true

# Ante 16 challenge
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME.joker_rate = 0"
position = "after"
payload = '''
elseif v.id == 'marathon' then 
    G.GAME.win_ante = 16
'''
match_indent = true
